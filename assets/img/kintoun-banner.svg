  <defs>
    <linearGradient id="cloudBody" x1="0" y1="12" x2="0" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="0.4" stop-color="#ffd056"/>
      <stop offset="1" stop-color="#ff8c14"/>
    </linearGradient>
    <linearGradient id="kanjiGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffad4"/>
      <stop offset="0.5" stop-color="#fff078"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <radialGradient id="kanjiHalo" cx="50%" cy="50%" r="50%">
