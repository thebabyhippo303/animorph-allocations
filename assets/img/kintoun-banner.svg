      <stop offset="0.55" stop-color="#ff8c14" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ff8c14" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-35%" y="-45%" width="170%" height="190%">
